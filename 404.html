<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071b17">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/svg+xml" href="assets/mark.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <title>الصفحة غير موجودة | ميثاق المؤمن</title>
  <style>
    .error-page { min-height: 85vh; display: grid; place-items: center; text-align: center; padding: 50px 22px; }
    .error-page strong { display: block; color: var(--gold); font-size: clamp(76px,16vw,140px); line-height: 1.1; font-weight: 300; }
    .error-page h1 { margin: 13px 0 8px; font-size: clamp(25px,5vw,40px); font-weight: 500; }
    .error-page p { margin: 0 0 26px; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <main class="error-page">
    <div>
      <strong>404</strong>
      <h1>هذه الصفحة غير موجودة</h1>
      <p>قد يكون الرابط غير صحيح أو أن الصفحة نُقلت.</p>
      <a class="button button--gold" href="index.html">العودة إلى ميثاق المؤمن <span aria-hidden="true">←</span></a>
    </div>
  </main>
</body>
</html>
